<!-- El marco de Lámina mueve estos nodos a sus huecos sin clonarlos ni reconstruirlos;
     los listeners, la selección y el foco del editor se conservan. El inicio se monta
     aparte y deja el editor inerte mientras está abierto. -->
<div class="app" id="app">
  <input class="deck-title" id="deckTitleInput" aria-label="Título de la presentación" title="Título de la presentación" placeholder="Presentación sin título">
  <span class="save-ind" id="saveInd" role="status" aria-live="polite"></span>
  <div class="cabecera-acciones" id="cabecera-acciones">
    <button class="icon-btn" id="undoBtn" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">⟲</button>
    <button class="icon-btn" id="redoBtn" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer">⟳</button>
    <div class="tb-sep"></div>
    <button class="btn only-wide" id="decksBtn" title="Archivo (mis presentaciones, abrir, guardar)">Archivo</button>
    <button class="btn only-wide" id="shareBtn" title="Compartir (revisar y exportar)">Compartir</button>
    <button class="icon-btn only-narrow" id="moreBtn" title="Archivo, compartir y ayuda" aria-label="Más opciones">⋯</button>
    <button class="btn btn-pri" id="presentBtn" aria-label="Presentar" title="Presentar (F5)"><span class="only-wide-i">▶ Presentar</span><span class="only-narrow-i">▶</span></button>
  </div>
  <div class="cabecera-utilidades" id="cabecera-utilidades">
    <button class="icon-btn hamb" id="hambBtn" aria-controls="inspector" aria-expanded="false" title="Panel de edición" aria-label="Abrir panel de edición">☰</button>
    <button id="edicionBadge" class="ed-badge" aria-label="AGPLv3 · Acerca de Lámina">AGPLv3</button>
    <button class="icon-btn" id="buscarBtn" title="Buscar y reemplazar (Ctrl+F)" aria-label="Buscar">⌕</button>
    <button class="icon-btn only-wide" id="temaBtn" title="Apariencia del editor" aria-label="Apariencia del editor">◐</button>
    <input type="checkbox" id="densChk" class="dens-chk only-wide" aria-label="Interfaz compacta">
    <label class="icon-btn dens-btn only-wide" for="densChk" title="Densidad de la interfaz: cómoda o compacta"></label>
    <button class="icon-btn" id="asisBtn" title="Asistente (Ctrl+J)" aria-label="Asistente">✦</button>
    <button class="icon-btn only-wide" id="helpBtn" title="Ayuda y atajos" aria-label="Ayuda">?</button>
  </div>
  <div class="modo-fila" id="modoFila"><div class="seg seg-modo" role="tablist" aria-label="Modo de edición">
    <button type="button" class="on" id="modoVisual" role="tab" aria-selected="true">Visual</button>
    <button type="button" id="modoGuion" role="tab" aria-selected="false">Guion</button>
  </div></div>
  <div class="cinta" id="cinta" role="region" aria-label="Cinta de herramientas" hidden></div>
  <div class="filmstrip">
    <div class="fs-head"><span class="panel-label">Diapositivas</span></div>
    <div class="fs-list" id="fsList" role="list" aria-label="Diapositivas"></div>
    <button class="btn fs-add" id="addSlideBtn" title="Nueva diapositiva"><span class="only-wide-i">+ Nueva diapositiva</span><span class="only-narrow-i">+</span></button>
  </div>
  <div class="canvas-wrap">
    <div id="barraContextual" class="barra-contextual" role="toolbar" aria-label="Herramientas del objeto" hidden></div>
    <div class="canvas-scroll" id="canvasScroll">
      <div class="stage" id="stage"><div class="stage-inner" id="stageInner"></div></div>
    </div>
    <div class="canvas-foot">
      <div class="foot-izq">
        <span class="slide-pos" id="slidePos" role="status" aria-live="polite"></span>
        <button class="prep-ind" id="prepInd" title="Qué falta para que esté lista"></button>
      </div>
      <div class="zoombox">
        <button class="icon-btn" id="zoomOut" title="Alejar" aria-label="Alejar">−</button>
        <span class="zlabel" id="zoomLabel">100%</span>
        <button class="icon-btn" id="zoomIn" title="Acercar" aria-label="Acercar">+</button>
        <button class="icon-btn" id="zoomFit" title="Ajustar a la ventana" aria-label="Ajustar">⤢</button>
      </div>
    </div>
  </div>
  <div class="inspector" id="inspector" aria-label="Herramientas de edición">
    <div class="insp-tabs" role="tablist" aria-label="Pestañas de herramientas">
      <button class="itab on" role="tab" aria-selected="true" aria-controls="inspBody" tabindex="0" data-tab="insert">Insertar</button>
      <button class="itab" role="tab" aria-selected="false" aria-controls="inspBody" tabindex="-1" data-tab="slide">Propiedades</button>
      <button class="itab" role="tab" aria-selected="false" aria-controls="inspBody" tabindex="-1" data-tab="notes">Notas</button>
    </div>
    <div class="insp-body" id="inspBody"></div>
  </div>
</div>
<div id="inicioRoot"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="asisRoot"></div>
<div id="modalRoot"></div>
<div id="sorterRoot"></div>
<div id="argRoot"></div>
<div id="presentRoot"></div>
<div id="printArea"></div>
<div id="workbench" style="position:absolute;left:-99999px;top:0"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="daltonismo-deuter" color-interpolation-filters="linearRGB">
    <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/>
  </filter>
  <filter id="daltonismo-protan" color-interpolation-filters="linearRGB">
    <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0"/>
  </filter>
</svg>
