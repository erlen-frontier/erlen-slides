name: Publish release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
# Publicación hacia Erlen Suite (docs/CONTRATO-APP.md §5 y docs/actualizacion-automatica.md del
# portal): tras crear la release, el último paso envía un repository_dispatch «app-publicada» a
# erlen-suite con el ZIP de la release. Requiere el secreto ERLEN_SUITE_TOKEN (token fino con
# contents: write + pull_requests: write + issues: write en erlen-suite y contents: read aquí).
env:
  APP_ID: slides
  APP_STATUS: beta
  SUITE_REPO: jorgegonzalezsevilla/erlen-suite
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run examples
      - run: git diff --exit-code -- examples/
      - run: python3 herramientas/package-release.py
      - name: Comprobar etiqueta, versión y notas
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "La etiqueta $TAG no corresponde a la versión $version de package.json." >&2
            exit 1
          fi
          if [ ! -f "docs/publicacion-$version.md" ]; then
            echo "Faltan las notas docs/publicacion-$version.md." >&2
            exit 1
          fi
      - name: Redactar las notas con la descarga y su suma
        run: |
          version=$(node -p "require('./package.json').version")
          zip="erlen-slides-$version-web.zip"
          cat "docs/publicacion-$version.md" > notas.md
          {
            printf '\n## Descarga\n\n'
            printf 'Descomprime `%s` y abre `erlen-slides-offline.html`. ' "$zip"
            printf 'El README explica cómo servir la carpeta localmente.\n\n'
            printf '```\n%s\n```\n' "$(cat "dist/$zip.sha256")"
          } >> notas.md
      - name: Publicar la versión y sus archivos
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          zip="dist/erlen-slides-$version-web.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notas.md
            gh release upload "$TAG" "$zip" "$zip.sha256" --clobber
          else
            gh release create "$TAG" "$zip" "$zip.sha256" \
              --title "Erlen Slides $version — Scientific presentations" \
              --notes-file notas.md
          fi
      - name: Avisar al portal (repository_dispatch app-publicada)
        env:
          GH_TOKEN: ${{ secrets.ERLEN_SUITE_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          zip="dist/erlen-slides-$version-web.zip"
          name=$(basename "$zip")
          sha=$(sha256sum "$zip" | cut -c1-64)
          # id del asset del ZIP: el portal lo descarga por la API para que funcione con repos privados.
          asset_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq ".assets[] | select(.name == \"$name\") | .id")
          [ -n "$asset_id" ] || { echo "::error::el asset $name no está en la release $TAG"; exit 1; }
          asset_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          jq -n \
            --arg id "$APP_ID" \
            --arg version "$version" \
            --arg commit "$(git rev-parse HEAD)" \
            --arg sha256 "$sha" \
            --arg asset_url "$asset_url" \
            --arg status "$APP_STATUS" \
            '{event_type: "app-publicada", client_payload: {id: $id, version: $version, commit: $commit, sha256: $sha256, asset_url: $asset_url, status: $status}}' \
            | gh api "repos/${SUITE_REPO}/dispatches" --input -
          echo "Enviado app-publicada a ${SUITE_REPO}: $APP_ID $version ($asset_url)"
