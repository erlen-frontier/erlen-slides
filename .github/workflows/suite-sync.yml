name: Notify Suite of Slides updates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notify-suite-slides
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Queue integration of current Slides main
        env:
          GH_TOKEN: ${{ secrets.ERLEN_SUITE_TOKEN }}
        run: gh api repos/jorgegonzalezsevilla/erlen-suite/dispatches -f event_type=slides-changed
