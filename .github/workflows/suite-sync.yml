name: Notify Suite of Slides updates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notify-suite-slides
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Token de erlen-suite-sync (GitHub App de la organización)
        id: sync-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23likF5myNB8YmIKwP
          private-key: ${{ secrets.ERLEN_SYNC_APP_KEY }}
          owner: erlen-frontier-ops
      - name: Queue integration of current Slides main
        env:
          GH_TOKEN: ${{ steps.sync-token.outputs.token }}
        run: gh api repos/erlen-frontier-ops/erlen-suite/dispatches -f event_type=slides-changed
