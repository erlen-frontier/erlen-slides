# Común a todos los repos de Erlen (fuente: erlen-suite/docs/convencion.md). No editar por repo.
name: Convencion
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions: {}
jobs:
  convencion:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR title and description follow the Erlen convention
        env:
          TITULO: ${{ github.event.pull_request.title }}
          CUERPO: ${{ github.event.pull_request.body }}
        run: |
          ok=1
          tipos='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          if ! printf '%s' "$TITULO" | grep -qE "^($tipos)(\([a-z0-9._/-]+\))?!?: [^ ].{2,}$"; then
            echo "::error::Title must be a Conventional Commit: '<type>(<scope>): <summary>' with type in {$tipos}."; ok=0
          fi
          if printf '%s' "$TITULO" | grep -q '[áéíóúüñÁÉÍÓÚÜÑ¿¡]'; then
            echo "::error::Title must be in English (no accents, ñ, ¿ or ¡)."; ok=0
          fi
          if [ "${#TITULO}" -gt 100 ]; then echo "::error::Title longer than 100 characters."; ok=0; fi
          if ! printf '%s\n' "$CUERPO" | grep -qiE '^#{1,3} *testing'; then
            echo "::error::Description needs a '## Testing' section with the real test results."; ok=0
          fi
          [ "$ok" = 1 ] && echo "Convention OK: $TITULO"
          [ "$ok" = 1 ]
