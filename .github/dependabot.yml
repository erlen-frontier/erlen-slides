# Común a todos los repos de Erlen (fuente: Agentes/agentes-github/convencion). Actualizaciones agrupadas
# semanales; títulos en Conventional Commits para pasar el check `convencion`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: America/Mexico_City}
    commit-message: {prefix: "ci(deps)"}
    groups:
      actions: {patterns: ["*"]}
    open-pull-requests-limit: 2
  # Production and development dependencies in one grouped PR each; ranges are only widened
  # when a new version does not fit, so package.json keeps its current constraints.
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: America/Mexico_City}
    commit-message: {prefix: "chore(deps)"}
    groups:
      production: {dependency-type: production}
      development: {dependency-type: development}
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
