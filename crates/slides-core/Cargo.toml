[package]
name = "erlen-slides-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
